<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Эрнест Музафаров</title>
    <meta name="description" content="" />
    <meta name="theme-color" content="#05070a" />
    <link rel="canonical" href="https://ernestmuzafarov.tech/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ernestmuzafarov.tech/" />
    <meta property="og:title" content="Эрнест Музафаров — путь в AI/ML" />
    <meta property="og:description" content="Руководитель технической поддержки. Изучаю Python, машинное обучение и LLM." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Onest:wght@300;400;500&family=Unbounded:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=5" />
  </head>
  <body>
    <!-- Тексты всех элементов с data-i18n подставляются из объекта I18N в script.js -->

    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="preloader__top mono">
        <span data-i18n="preloader.label"></span>
        <span data-i18n="hero.nameFirst"></span>
      </div>
      <div class="preloader__count" id="preloader-count">000</div>
      <div class="preloader__bar"><span id="preloader-bar"></span></div>
    </div>

    <!-- 3D-сцена из частиц: фон всего сайта -->
    <canvas class="scene" id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <header class="header" id="header">
      <a href="#hero" class="logo mono" data-i18n="header.logo"></a>

      <nav class="nav mono" id="nav">
        <a href="#about" class="nav__link" data-i18n="nav.about"></a>
        <a href="#playground" class="nav__link" data-i18n="nav.playground"></a>
        <a href="#ideas" class="nav__link" data-i18n="nav.ideas"></a>
        <a href="#contacts" class="nav__link" data-i18n="nav.contacts"></a>
      </nav>

      <div class="header__tools mono">
        <button class="sound" id="sound" type="button" aria-pressed="false">
          <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span data-i18n="header.sound"></span>
        </button>
        <div class="lang" role="group" aria-label="Language">
          <button class="lang__btn" data-lang="ru" type="button">RU</button>
          <button class="lang__btn" data-lang="en" type="button">EN</button>
        </div>
      </div>
    </header>

    <!-- Номер текущей сцены -->
    <div class="scene-index mono" aria-hidden="true">
      <span class="scene-index__num" id="scene-num">01</span>
      <span class="scene-index__line"><span id="scene-progress"></span></span>
      <span class="scene-index__total">05</span>
      <span class="scene-index__name" id="scene-name"></span>
    </div>

    <main>
      <!-- 01 HERO -->
      <section class="hero" id="hero" data-scene="0">
        <div class="hero__top wrap mono">
          <span data-i18n="hero.eyebrow"></span>
          <span class="hero__status"><span class="live-dot"></span><span data-i18n="hero.status"></span></span>
        </div>

        <!-- Живые показатели нейросети на фоне: числа берутся из 3D-сцены -->
        <div class="hero__hud mono" id="hero-hud" aria-hidden="true">
          <div class="hud__row"><span data-i18n="hero.hud.neurons"></span><b id="hud-neurons">—</b></div>
          <div class="hud__row"><span data-i18n="hero.hud.links"></span><b id="hud-links">—</b></div>
          <div class="hud__row"><span data-i18n="hero.hud.fires"></span><b id="hud-fires">—</b></div>
          <p class="hud__hint" data-i18n="hero.hud.hint"></p>
        </div>

        <h1 class="hero__name" id="hero-name">
          <span class="hero__line" data-split data-i18n="hero.nameFirst"></span>
          <span class="hero__line hero__line--outline" data-split data-i18n="hero.nameLast"></span>
        </h1>

        <div class="hero__bottom wrap">
          <p class="hero__tagline" data-i18n="hero.tagline"></p>
          <div class="hero__actions">
            <a href="#about" class="btn btn--solid" data-magnetic>
              <span data-i18n="hero.ctaAbout"></span><span class="btn__icon">↓</span>
            </a>
            <a href="#contacts" class="btn btn--ghost" data-magnetic>
              <span data-i18n="hero.ctaContact"></span><span class="btn__icon">↗</span>
            </a>
          </div>
        </div>

        <div class="hero__scroll mono"><span data-i18n="hero.scroll"></span><i></i></div>
      </section>

      <div class="marquee mono" aria-hidden="true">
        <div class="marquee__track" id="marquee-track"></div>
      </div>

      <!-- 02 ОБО МНЕ -->
      <section class="section" id="about" data-scene="1">
        <div class="wrap">
          <div class="section-head reveal mono">
            <span>02</span><i></i><span data-i18n="about.label"></span>
          </div>
          <h2 class="big-title reveal" data-i18n="about.title"></h2>

          <div class="ice about reveal">
            <div class="about__photo">
              <!-- Нейро-аватар из частиц вместо фото: рисуется в script.js (initAvatar) -->
              <div class="photo">
                <canvas class="avatar" id="avatar" aria-hidden="true"></canvas>
                <span class="photo__tag mono">ID · E.M.</span>
                <span class="photo__note mono" data-i18n="about.avatarNote"></span>
              </div>
            </div>

            <div class="about__text">
              <p class="about__lead" data-i18n="about.p1"></p>
              <p data-i18n="about.p2"></p>
              <p data-i18n="about.p3"></p>
            </div>
          </div>

          <div class="block">
            <h3 class="block__title reveal mono"><span>02.1</span><span data-i18n="strengths.title"></span></h3>
            <ol class="ice rows" id="strengths"></ol>
          </div>

          <div class="block">
            <div class="block__head reveal">
              <h3 class="block__title mono"><span>02.2</span><span data-i18n="learning.title"></span></h3>
              <p class="block__note mono" data-i18n="learning.note"></p>
            </div>
            <div class="skills" id="learning"></div>
            <ul class="legend mono">
              <li><span class="cp cp--done"></span><span data-i18n="learning.done"></span></li>
              <li><span class="cp cp--current"></span><span data-i18n="learning.current"></span></li>
              <li><span class="cp cp--todo"></span><span data-i18n="learning.todo"></span></li>
            </ul>
          </div>
        </div>
      </section>

      <!-- 03 ЛАБОРАТОРИЯ -->
      <section class="section" id="playground" data-scene="2">
        <div class="wrap">
          <div class="section-head reveal mono">
            <span>03</span><i></i><span data-i18n="playground.label"></span>
          </div>
          <h2 class="big-title reveal" data-i18n="playground.title"></h2>
          <p class="section__intro reveal" data-i18n="playground.intro"></p>

          <div class="tabs reveal mono" role="tablist">
            <button type="button" class="tabs__btn is-active" role="tab" data-tab="neuron">
              <span class="tabs__num">01</span><span data-i18n="playground.tabNeuron"></span>
            </button>
            <button type="button" class="tabs__btn" role="tab" data-tab="gd">
              <span class="tabs__num">02</span><span data-i18n="playground.tabGd"></span>
            </button>
            <button type="button" class="tabs__btn" role="tab" data-tab="llm">
              <span class="tabs__num">03</span><span data-i18n="playground.tabLlm"></span>
            </button>
          </div>

          <!-- 01: нейрон -->
          <div class="tab-panel reveal" id="tab-neuron" role="tabpanel">
            <p class="panel__intro" data-i18n="playground.neuronIntro"></p>
            <div class="lab">
              <div class="ice lab__board">
                <canvas id="lab-canvas" class="lab__canvas"></canvas>
                <p class="lab__empty mono" id="lab-empty" data-i18n="playground.empty"></p>
              </div>

              <div class="ice lab__panel">
                <div class="lab__group">
                  <span class="lab__caption mono" data-i18n="playground.classLabel"></span>
                  <div class="seg">
                    <button type="button" class="seg__btn is-active" data-class="1">
                      <span class="swatch swatch--a"></span><span data-i18n="playground.classA"></span>
                    </button>
                    <button type="button" class="seg__btn" data-class="0">
                      <span class="swatch swatch--b"></span><span data-i18n="playground.classB"></span>
                    </button>
                  </div>
                </div>

                <div class="lab__group">
                  <span class="lab__caption mono" data-i18n="playground.modelLabel"></span>
                  <div class="seg">
                    <button type="button" class="seg__btn is-active" data-model="neuron" data-i18n="playground.modelNeuron"></button>
                    <button type="button" class="seg__btn" data-model="mlp" data-i18n="playground.modelMlp"></button>
                  </div>
                </div>

                <div class="lab__group lab__buttons">
                  <button type="button" class="btn btn--solid btn--sm" id="lab-train" data-i18n="playground.train"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="lab-preset-line" data-i18n="playground.presetLine"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="lab-preset-circle" data-i18n="playground.presetCircle"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="lab-clear" data-i18n="playground.clear"></button>
                </div>

                <dl class="stats mono">
                  <div><dt data-i18n="playground.epoch"></dt><dd id="stat-epoch">0</dd></div>
                  <div><dt data-i18n="playground.loss"></dt><dd id="stat-loss">—</dd></div>
                  <div><dt data-i18n="playground.accuracy"></dt><dd id="stat-acc">—</dd></div>
                </dl>

                <p class="lab__tip" data-i18n="playground.tip"></p>
              </div>
            </div>
          </div>

          <!-- 02: градиентный спуск -->
          <div class="tab-panel" id="tab-gd" role="tabpanel" hidden>
            <p class="panel__intro" data-i18n="gd.intro"></p>
            <div class="lab">
              <div class="ice lab__board">
                <canvas id="gd-canvas" class="lab__canvas"></canvas>
                <p class="lab__corner mono" data-i18n="gd.hint"></p>
              </div>

              <div class="ice lab__panel">
                <div class="lab__group">
                  <span class="lab__caption mono" data-i18n="gd.surface"></span>
                  <div class="seg">
                    <button type="button" class="seg__btn is-active" data-surface="bowl" data-i18n="gd.bowl"></button>
                    <button type="button" class="seg__btn" data-surface="hills" data-i18n="gd.hills"></button>
                  </div>
                </div>

                <div class="lab__group">
                  <label class="lab__caption mono range-head" for="gd-lr">
                    <span data-i18n="gd.lr"></span><span class="range-val" id="gd-lr-val">0.10</span>
                  </label>
                  <input type="range" class="range" id="gd-lr" min="0.01" max="0.45" step="0.01" value="0.1" />
                </div>

                <div class="lab__group lab__buttons">
                  <button type="button" class="btn btn--solid btn--sm" id="gd-run" data-i18n="gd.run"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="gd-reset" data-i18n="gd.reset"></button>
                </div>

                <dl class="stats mono">
                  <div><dt data-i18n="gd.step"></dt><dd id="gd-step">0</dd></div>
                  <div><dt data-i18n="gd.loss"></dt><dd id="gd-loss">—</dd></div>
                  <div><dt data-i18n="gd.status"></dt><dd id="gd-status" data-i18n="gd.statusIdle"></dd></div>
                </dl>

                <p class="lab__tip" data-i18n="gd.tip"></p>
              </div>
            </div>
          </div>

          <!-- 03: как LLM выбирает слово -->
          <div class="tab-panel" id="tab-llm" role="tabpanel" hidden>
            <p class="panel__intro" data-i18n="llm.intro"></p>
            <div class="lab">
              <div class="ice llm">
                <div class="seg seg--wrap" id="llm-prompts"></div>

                <div class="llm__block">
                  <span class="lab__caption mono" data-i18n="llm.tokensLabel"></span>
                  <div class="tokens" id="llm-tokens"></div>
                </div>

                <div class="llm__block">
                  <span class="lab__caption mono" data-i18n="llm.nextLabel"></span>
                  <div class="probs" id="llm-probs"></div>
                </div>

                <p class="lab__tip" data-i18n="llm.note"></p>
              </div>

              <div class="ice lab__panel">
                <div class="lab__group">
                  <label class="lab__caption mono range-head" for="llm-temp">
                    <span data-i18n="llm.temp"></span><span class="range-val" id="llm-temp-val">1.00</span>
                  </label>
                  <input type="range" class="range" id="llm-temp" min="0.1" max="2" step="0.05" value="1" />
                </div>

                <p class="lab__tip temp-hint" id="llm-temp-hint" data-i18n="llm.tempMid"></p>

                <div class="lab__group lab__buttons">
                  <button type="button" class="btn btn--solid btn--sm" id="llm-sample" data-i18n="llm.sample"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="llm-sample20" data-i18n="llm.sample20"></button>
                  <button type="button" class="btn btn--ghost btn--sm" id="llm-reset" data-i18n="llm.reset"></button>
                </div>

                <dl class="stats stats--2 mono">
                  <div><dt data-i18n="llm.samples"></dt><dd id="llm-count">0</dd></div>
                  <div><dt data-i18n="llm.topShare"></dt><dd id="llm-top">—</dd></div>
                </dl>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 04 ИДЕИ: ИИ В ПОДДЕРЖКЕ -->
      <section class="section" id="ideas" data-scene="3">
        <div class="wrap">
          <div class="section-head reveal mono">
            <span>04</span><i></i><span data-i18n="ideas.label"></span>
          </div>
          <h2 class="big-title reveal" data-i18n="ideas.title"></h2>
          <p class="section__intro reveal" data-i18n="ideas.intro"></p>

          <div class="stack" id="ideas-list"></div>

          <div class="ice note reveal">
            <span class="note__label mono" data-i18n="ideas.noteLabel"></span>
            <p data-i18n="ideas.note"></p>
          </div>
        </div>
      </section>

      <!-- 05 КОНТАКТЫ -->
      <section class="section contacts" id="contacts" data-scene="4">
        <div class="wrap">
          <div class="section-head reveal mono">
            <span>05</span><i></i><span data-i18n="contacts.label"></span>
          </div>

          <a class="cta reveal" id="cta-telegram" target="_blank" rel="noopener" data-morph="Telegram">
            <span class="cta__line" data-i18n="contacts.ctaA"></span>
            <span class="cta__line"><span data-i18n="contacts.ctaB"></span><span class="cta__arrow">↗</span></span>
          </a>
          <p class="section__intro reveal" data-i18n="contacts.intro"></p>

          <ul class="ice links reveal">
            <li>
              <a class="link-row" id="contact-telegram" target="_blank" rel="noopener" data-morph="Telegram">
                <span class="link-row__label mono">Telegram</span>
                <span class="link-row__value contact__value"></span>
                <span class="link-row__arrow">↗</span>
              </a>
            </li>
            <li>
              <a class="link-row" id="contact-github" target="_blank" rel="noopener" data-morph="GitHub">
                <span class="link-row__label mono">GitHub</span>
                <span class="link-row__value contact__value"></span>
                <span class="link-row__arrow">↗</span>
              </a>
            </li>
            <li>
              <a class="link-row" id="contact-linkedin" target="_blank" rel="noopener" data-morph="LinkedIn">
                <span class="link-row__label mono">LinkedIn</span>
                <span class="link-row__value contact__value"></span>
                <span class="link-row__arrow">↗</span>
              </a>
            </li>
          </ul>

          <p class="contacts__hint mono" data-i18n="contacts.hint"></p>
        </div>
        <!-- пустая «сцена» внизу: здесь частицы складываются в имя и названия ссылок -->
        <div class="stage" aria-hidden="true"></div>
      </section>
    </main>

    <footer class="footer wrap mono">
      <span data-i18n="footer.text"></span>
      <span>© <span id="year"></span></span>
    </footer>

    <!-- three.js рисует 3D-сцену, Lenis даёт плавный скролл.
         Если библиотеки не загрузятся, сайт работает без них -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="script.js?v=11"></script>
  </body>
</html>
